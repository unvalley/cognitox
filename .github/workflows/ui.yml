name: UI

on:
  push:
    branches:
      - main
    paths:
      - "ui/**"
  pull_request:
    paths:
      - "ui/**"

jobs:
  build:
    name: Build UI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: cd ui && npm ci

      - name: Build
        run: cd ui && npm run build
