[package]
name = "cognitox"
version = "0.1.2"
edition = "2024"
rust-version = "1.94.1"
description = "AWS Cognito User Pools emulator for local development"
license = "MIT"
readme = "README.md"
homepage = "https://github.com/unvalley/cognitox"
repository = "https://github.com/unvalley/cognitox"
keywords = ["aws", "cognito", "emulator", "testing", "local"]
categories = ["development-tools::testing", "web-programming"]
default-run = "cognitox"
include = [
    "/src/*.rs",
    "/src/action/**/*.rs",
    "/src/api/**/*.rs",
    "/ui/dist/**/*",
    "/build.rs",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE",
    "/COVERAGE.md",
]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }-v{ version }{ archive-suffix }"
bin-dir = "{ name }-{ target }-v{ version }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"
disabled-strategies = ["quick-install"]

[package.metadata.binstall.overrides.'cfg(target_os = "windows")']
pkg-fmt = "zip"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"

jsonwebtoken = { version = "10", features = ["rust_crypto"] }
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
rsa = { version = "0.9", features = ["std"] }
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
rand = "0.8"
bcrypt = "0.19"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
bpaf = { version = "0.9", features = ["derive"] }

# Config
dotenvy = "0.15"

# Templates
tera = "1"

# URL encoding
urlencoding = "2"

# Embedded static assets (admin UI)
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
mime_guess = "2"

[profile.release]
strip = true
lto = true

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
urlencoding = "2"
